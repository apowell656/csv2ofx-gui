name: Build release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate version
        id: version
        run: python packaging/ci/release.py version
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm OpenStatement.spec
      - name: Validate and stage executable
        run: python packaging/ci/release.py windows
      - uses: actions/upload-artifact@v7
        with:
          name: Windows-${{ steps.version.outputs.version }}-x64
          path: dist/packages/OpenStatement-${{ steps.version.outputs.version }}-Windows-x64.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate version
        id: version
        run: python packaging/ci/release.py version
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot desktop-file-utils curl file libglib2.0-0t64 libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Test
        run: .venv/bin/python -m pytest -q
      - name: Build and validate Linux packages
        run: bash packaging/linux/build_release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Linux-${{ steps.version.outputs.version }}-x86_64
          path: |
            dist/packages/openstatement_${{ steps.version.outputs.version }}_amd64.deb
            dist/packages/OpenStatement-${{ steps.version.outputs.version }}-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true
          path: dist/packages
      - name: Verify complete release set
        run: python packaging/ci/release.py verify
      - name: Attach packages without publishing
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "OpenStatement $RELEASE_TAG" --notes "Windows and Linux builds. Add the locally built macOS binary before publishing."
          fi
          gh release upload "$RELEASE_TAG" dist/packages/*
